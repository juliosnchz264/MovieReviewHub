name: Backend CI

on:
  push:
    branches: [master, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Compile
        run: ./mvnw -B clean compile

      - name: Run tests (unit + integration with Testcontainers)
        run: ./mvnw -B test

      - name: Package
        run: ./mvnw -B package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # Reproduce el deploy de Render: build de la imagen Docker + arranque contra
  # Postgres efimero. Falla si la entidad y las migraciones se desincronizan
  # (lo que paso con `genre` -> `genres[]`), o si el contexto de Spring no
  # levanta por otra razon. Bloqueable como required check antes de mergear.
  smoke-test:
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smoke
          POSTGRES_PASSWORD: smoke
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (mismo Dockerfile que Render)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          load: true
          tags: moviereviewhub-backend:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container against Postgres
        run: |
          docker run -d --name smoke \
            --network host \
            -e SERVER_PORT=8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL=jdbc:postgresql://localhost:5432/smoke \
            -e DB_USERNAME=smoke \
            -e DB_PASSWORD=smoke \
            -e JWT_SECRET=c21va2VfdGVzdF9zZWNyZXRfMzJfYnl0ZXNfbWluX2Jhc2U2NA== \
            -e CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            moviereviewhub-backend:smoke

      - name: Wait for /actuator/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Service UP after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Service did not come up — dumping logs:"
          docker logs smoke
          exit 1

      - name: Container logs (always)
        if: always()
        run: docker logs smoke || true
