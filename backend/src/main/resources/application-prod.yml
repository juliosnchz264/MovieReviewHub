# Overrides solo para perfil prod (Render).
# Activado via SPRING_PROFILES_ACTIVE=prod en render.yaml.
spring:
  main:
    # Beans se inicializan al primer request, no al arranque.
    # Reduce startup ~30% en free tier; primera request al endpoint paga la latencia.
    lazy-initialization: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # Evita scan de schema en startup mas alla de validate (ya esta en validate).
        boot:
          allow_jdbc_metadata_access: true

# Cookie defaults para prod: Secure + SameSite=None (cross-site para frontend
# en Vercel + backend en Render). Pueden seguir siendo sobreescritos por env
# vars en render.yaml; este bloque cierra el agujero de un deployment que
# olvide poner COOKIE_SECURE/COOKIE_SAME_SITE y herede los defaults de dev.
app:
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:None}
