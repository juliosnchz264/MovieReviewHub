spring:
  application:
    name: moviereviewhub
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    # Datasource separado: session-mode pooler (port 5432) para advisory locks.
    # App runtime usa transaction-mode (port 6543) via spring.datasource.url.
    url: ${FLYWAY_DB_URL:${DB_URL}}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cookie:
    refresh-token-name: ${COOKIE_REFRESH_NAME:refreshToken}
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    path: ${COOKIE_PATH:/}
    domain: ${COOKIE_DOMAIN:}
  tmdb:
    api-key: ${TMDB_API_KEY:}
    base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
    image-base-url: ${TMDB_IMAGE_BASE_URL:https://image.tmdb.org/t/p}
    poster-size: ${TMDB_POSTER_SIZE:w500}
  keep-alive:
    enabled: ${KEEP_ALIVE_ENABLED:false}
    url: ${KEEP_ALIVE_URL:${RENDER_EXTERNAL_URL:}/actuator/health}
    interval-ms: ${KEEP_ALIVE_INTERVAL_MS:600000}

# Logging configurado en logback-spring.xml (perfil-aware: JSON en prod, pretty en dev)
