spring:
  application:
    name: moviereviewhub-test
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
  # datasource.* lo provee Testcontainers via @ServiceConnection
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 0

app:
  jwt:
    secret: dGVzdC1zZWNyZXQtZm9yLXVuaXQtdGVzdHMtMjU2LWJpdHM=
    access-expiration-ms: 900000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:3000
  cookie:
    refresh-token-name: refreshToken
    secure: false
    same-site: Lax
    path: /
    domain: ""

logging:
  level:
    root: WARN
    com.moviereviewhub: INFO
    org.hibernate.SQL: WARN
    org.testcontainers: WARN
