# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Crea backend service en Render apuntando a Supabase.
# Requiere setear secrets en Render dashboard: JWT_SECRET, DB_*, TMDB_API_KEY.

services:
  - type: web
    name: moviereviewhub-backend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # DB — Supabase Session Pooler
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      # JWT — generar con: openssl rand -base64 32
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRATION_MS
        value: "900000"
      - key: JWT_REFRESH_EXPIRATION_MS
        value: "604800000"

      # CORS — apuntar a Vercel URL
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Cookie cross-site (HTTPS obligatorio)
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: None
      - key: COOKIE_REFRESH_NAME
        value: refreshToken
      - key: COOKIE_PATH
        value: /

      # TMDB — opcional
      - key: TMDB_API_KEY
        sync: false

      # Keep-alive: self-ping cada 10min mientras awake. RENDER_EXTERNAL_URL
      # lo expone Render automaticamente -> no hay que setearlo a mano.
      # El cron externo de GitHub Actions complementa cuando el servicio se durmio.
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_INTERVAL_MS
        value: "600000"
